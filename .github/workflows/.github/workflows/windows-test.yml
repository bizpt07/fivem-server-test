
name: Testar ambiente Windows FiveM

on:
  workflow_dispatch:

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Verificar Windows
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion

      - name: Verificar ferramentas
        run: |
          git --version
          curl.exe --version
          Get-PSDrive C

      - name: Criar pasta de teste
        run: |
          New-Item -ItemType Directory `
            -Path "$env:RUNNER_TEMP\FXServer" `
            -Force
          Write-Host "Ambiente de teste preparado."
